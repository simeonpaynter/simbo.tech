<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule & Bookings</title>
    <style>
        :root {
            --bg-color: #f5f5f7;
            --card-bg: #ffffff;
            --text-color: #1d1d1f;
            --accent-color: #0071e3;
            --border-radius: 16px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            background: var(--card-bg);
            padding: 24px;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: center;
        }

        iframe {
            border: none;
            width: 100%;
            border-radius: 12px;
        }

        /* Responsive Layout Engine */
        .desktop-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .mobile-layout {
            display: none;
        }

        /* Mobile Breakpoint (768px and down) */
        @media (max-width: 768px) {
            body {
                padding: 12px;
            }
            .desktop-layout {
                display: none;
            }
            .mobile-layout {
                display: flex;
                flex-direction: column;
                gap: 16px;
                text-align: center;
            }
            .booking-btn {
                display: block;
                background-color: var(--accent-color);
                color: #ffffff;
                padding: 16px;
                font-weight: 600;
                text-decoration: none;
                border-radius: 12px;
                font-size: 16px;
                transition: background 0.2s ease;
            }
            .booking-btn:active {
                background-color: #005bb5;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Calendar</h1>

    <!-- Laptop/Desktop View: Side-by-Side Frames -->
    <div class="desktop-layout">
        <div class="card-box">
            <!-- Replace SRC with your Google Calendar Embed URL -->
            <iframe src="https://calendar.google.com/calendar/embed?wkst=1&ctz=America%2FChicago&mode=WEEK&src=NGRkNTVlOWJmYmE1YTgzOGI5YzZlZTYwOGI3NjVlZGVlMmZmOGYzYTE4MDNmZTRjYjBjMGQxNmUzOTY4OTM2OUBncm91cC5jYWxlbmRhci5nb29nbGUuY29t&color=%23b39ddb" style="border:solid 1px #777" frameborder="0" scrolling="no"></iframe>
        </div>
        <div class="card-box">
            <!-- Replace SRC with your Google Appointment Inline Embed URL -->
            <iframe src="https://google.com" height="600"></iframe>
        </div>
    </div>

    <!-- Mobile View: Action Button + Single Simplified View -->
    <div class="mobile-layout">
        <!-- Direct Link for native full-screen mobile browser booking -->
        <a href="https://google.com" target="_blank" class="booking-btn">
            Tap to Book an Appointment
        </a>
        
        <!-- Optional: Slim agenda/calendar view under the button for mobile reference -->
        <iframe src="https://calendar.google.com/calendar/embed?height=600&wkst=1&ctz=America%2FChicago&mode=AGENDA&src=NGRkNTVlOWJmYmE1YTgzOGI5YzZlZTYwOGI3NjVlZGVlMmZmOGYzYTE4MDNmZTRjYjBjMGQxNmUzOTY4OTM2OUBncm91cC5jYWxlbmRhci5nb29nbGUuY29t&color=%23b39ddb" style="border:solid 1px #777" height="400" frameborder="0" scrolling="no"></iframe>
    </div>
</div>

</body>
</html>
