<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Documentation - Simeon Paynter</title>
    <style>
        :root {
            --bg-color: #FAFAFA;
            --text-color: #202020;
            --text-color-bold: #1A1A1A;
            --text-color-light: #262626;
            --accent-color-yellow: #FFCB05;
            --primary-font-stack: Arial, sans-serif;
        }
        body, *, *:before, *:after {
            margin: 0;
            padding: 0;
        }
        header {
            min-height: 100px;
            background-color: var(--bg-color);
            color: var(--text-color);
        }
        main {
            min-height: 400px;
            background-color: var(--bg-color);
            color: var(--text-color);
        }
        footer {
            min-height: 100px;
            background-color: var(--bg-color);
            color: var(--text-color);
        }
        #coming-soon {
            font-size: 3em;
            justify-content: center; /*horizontal*/
            align-items: center; /*vertical*/
            margin: 25px;
        }
    </style>
</head>
    <!-- Google tag (gtag.js) -->    
<body>
    <header></header>
    <h1>Coming soon.... November 2026</h1>
    <main>
        <h1 id="coming-soon">Coming soon....<br>November 2026</h1>
    </main>
    <footer>Placeholder for footer</footer>
</body>
</html>
